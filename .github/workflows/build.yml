
name: Build VirtualBox Windows Installer

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "VirtualBox source branch, tag, or commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      VBOX_BUILD_TYPE: release
      VBOX_TARGET_ARCH: amd64

    steps:
      - name: Checkout VirtualBox source
        uses: actions/checkout@v4
        with:
          repository: VirtualBox/virtualbox
          ref: ${{ inputs.ref }}
          path: virtualbox
          submodules: recursive
          fetch-depth: 1

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vs = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (!$vs -or !(Test-Path "$vs\Common7\Tools\VsDevCmd.bat")) {
            throw "Visual Studio C++ build tools not found"
          }

          "VS_INSTALL=$vs" >> $env:GITHUB_ENV
          "Visual Studio: $vs"

      - name: Check prerequisites
        shell: pwsh
        run: |
          python --version
          git --version

          Get-ChildItem Env: |
            Where-Object Name -Match '^(VSCMD|VSINSTALLDIR|WindowsSdkDir)'

          $vs = $env:VS_INSTALL
          if (!(Test-Path "$vs\VC\Auxiliary\Build\vcvarsall.bat")) {
            throw "Visual C++ environment is incomplete"
          }

          Get-PSDrive -Name C

      - name: Configure and build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = Join-Path $env:GITHUB_WORKSPACE "virtualbox"
          $log = Join-Path $env:GITHUB_WORKSPACE "build-logs"
          New-Item -ItemType Directory -Force $log | Out-Null

          @'
          @echo off
          setlocal
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b %errorlevel%

          cd /d "%GITHUB_WORKSPACE%\virtualbox"
          if errorlevel 1 exit /b %errorlevel%

          python configure.py
          if errorlevel 1 exit /b %errorlevel%

          where kmk
          if errorlevel 1 (
            echo ERROR: kmk was not found after configuration.
            echo Install or fetch the toolchain required by this source revision.
            exit /b 1
          )

          kmk KBUILD_TYPE=release
          if errorlevel 1 exit /b %errorlevel%

          kmk KBUILD_TYPE=release packing
          if errorlevel 1 exit /b %errorlevel%

          exit /b 0
          '@ | Set-Content -Encoding ASCII "$log\build.cmd"

          $process = Start-Process -FilePath "cmd.exe" `
            -ArgumentList @("/d", "/c", "`"$log\build.cmd`"") `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "$log\stdout.log" `
            -RedirectStandardError "$log\stderr.log"

          Get-Content "$log\stdout.log" -Tail 100
          Get-Content "$log\stderr.log" -Tail 100

          if ($process.ExitCode -ne 0) {
            throw "VirtualBox build failed with exit code $($process.ExitCode)"
          }

      - name: Collect installer and build metadata
        if: always()
        shell: pwsh
        run: |
          $repo = Join-Path $env:GITHUB_WORKSPACE "virtualbox"
          $dest = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force $dest | Out-Null

          $roots = @(
            "$repo\out\win.amd64\release\bin",
            "$repo\out\win.amd64\debug\bin"
          )

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -File |
                Where-Object {
                  $_.Extension -in @(".msi", ".exe", ".cab") -and
                  $_.Name -like "VirtualBox*"
                } |
                Copy-Item -Destination $dest -Force
            }
          }

          git -C $repo rev-parse HEAD |
            Set-Content "$dest\source-commit.txt"

          git -C $repo status --short |
            Set-Content "$dest\source-status.txt"

          if (!(Get-ChildItem $dest -Filter "*.msi" -File)) {
            Write-Warning "No MSI found. Check build logs and packaging prerequisites."
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-windows-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-windows-installer
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
