name: Build VirtualBox 7.2 (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - VBox-7.2

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      VBOX_SOURCE: ${{ github.workspace }}
      KBUILD_PATH: ${{ github.workspace }}\kBuild\kBuild
      VBOX_WITHOUT_ADDITIONS: "1"
      VBOX_WITH_ADDITIONS_PACKING: ""

    steps:
      - name: Checkout VirtualBox
        uses: actions/checkout@v4
        with:
          repository: VirtualBox/virtualbox
          ref: VBox-7.2
          fetch-depth: 1
          submodules: recursive

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Verify kBuild and Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Source directory ==="
          Write-Host $env:VBOX_SOURCE

          Write-Host "=== kBuild directory ==="
          Write-Host $env:KBUILD_PATH

          $required = @(
            "footer.kmk",
            "header.kmk",
            "rules.kmk",
            "bin\win.amd64\kmk.exe",
            "bin\win.amd64\kmk_ash.exe",
            "bin\win.x86\kmk.exe"
          )

          foreach ($item in $required) {
            $path = Join-Path $env:KBUILD_PATH $item
            if (-not (Test-Path $path)) {
              throw "Missing required kBuild file: $path"
            }
            Write-Host "OK: $path"
          }

          $sdk = "C:\Program Files (x86)\Windows Kits\10"
          if (-not (Test-Path (Join-Path $sdk "Include"))) {
            throw "Windows 10 SDK Include directory not found: $sdk"
          }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe not found. MSVC environment was not initialized."
          }

          Write-Host "=== Compiler ==="
          cl.exe 2>&1 | Select-Object -First 3

          Write-Host "=== SDK versions ==="
          Get-ChildItem (Join-Path $sdk "Include") -Directory |
            Where-Object { $_.Name -like "10.0.*" } |
            Select-Object -ExpandProperty Name

      - name: Patch legacy DDK 7.1 check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = Join-Path $env:VBOX_SOURCE "configure.vbs"

          if (-not (Test-Path $file)) {
            throw "configure.vbs not found: $file"
          }

          $lines = [System.IO.File]::ReadAllLines($file)
          $matches = @()

          for ($i = 2000; $i -lt $lines.Length; $i++) {
            if (
              $lines[$i].Contains("CheckForWinDDK") -and
              $lines[$i].Contains("strOptDDK") -and
              $lines[$i] -notmatch '^\s*(sub|function)\b'
            ) {
              $matches += $i
            }
          }

          if ($matches.Count -ne 1) {
            Write-Host "Matching lines:"
            Select-String -Path $file -Pattern "CheckForWinDDK" |
              ForEach-Object {
                Write-Host "$($_.LineNumber): $($_.Line)"
              }

            throw "Expected one DDK check call; found $($matches.Count)."
          }

          $idx = $matches[0]
          Write-Host "Original line $($idx + 1): $($lines[$idx])"

          $lines[$idx] =
            "    ' Experimental: skip legacy DDK 7.1 configure check"

          [System.IO.File]::WriteAllLines(
            $file,
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Patched line $($idx + 1)."
          Get-Content $file |
            Select-Object -Skip ($idx - 2) -First 5

      - name: Install Yasm runtime and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Yasm 1.3.0 may require the Visual C++ 2010 runtime.
          choco install vcredist2010 -y --no-progress

          $url = "https://github.com/yasm/yasm/releases/download/v1.3.0/yasm-1.3.0-win64.exe"
          $dir = Join-Path $env:RUNNER_TEMP "yasm"
          $exe = Join-Path $dir "yasm.exe"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $exe

          Write-Host "=== Yasm version ==="
          $output = & $exe --version 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host "$_" }

          if ($exitCode -ne 0) {
            throw "Yasm failed to start (exit code $exitCode). Check missing DLL dependencies."
          }

          if (($output -join "`n") -notmatch 'yasm\s+1\.3\.0') {
            throw "Expected Yasm 1.3.0."
          }

          # Dùng Add-Content thay cho Out-File để tránh lỗi pipe
          Add-Content -Path $env:GITHUB_PATH -Value $dir -Encoding utf8
          Write-Host "Yasm 1.3.0 is ready."

      - name: Setup libSDL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdl_url = "https://www.libsdl.org/release/SDL-devel-1.2.15-VC.zip"
          
          $sdl_dir = Join-Path -Path $env:RUNNER_TEMP -ChildPath "SDL"
          New-Item -ItemType Directory -Force -Path $sdl_dir | Out-Null
          
          Invoke-WebRequest -Uri $sdl_url -OutFile "$sdl_dir\sdl.zip"
          Expand-Archive -Path "$sdl_dir\sdl.zip" -DestinationPath $sdl_dir -Force
          
          $sdl_path = Join-Path -Path $sdl_dir -ChildPath "SDL-1.2.15"
          
          # VirtualBox expects SDL.lib directly inside the 'lib' directory.
          # SDL zip places them inside 'lib/x64'. We move them up.
          $libDir = Join-Path -Path $sdl_path -ChildPath "lib"
          $libX64 = Join-Path -Path $libDir -ChildPath "x64"
          $libX86 = Join-Path -Path $libDir -ChildPath "x86"
          
          if (Test-Path $libX64) {
              Copy-Item -Path "$libX64\*" -Destination $libDir -Force
              Write-Host "Moved x64 SDL libs to the root of the lib directory."
          } elseif (Test-Path $libX86) {
              Copy-Item -Path "$libX86\*" -Destination $libDir -Force
          }
          
          Add-Content -Path $env:GITHUB_ENV -Value "VBOX_SDL_PATH=$sdl_path" -Encoding utf8
          Write-Host "Installed libSDL to $sdl_path"

      - name: Configure VirtualBox
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          $sdk = "C:\Program Files (x86)\Windows Kits\10"
          $binDir = Join-Path -Path $sdk -ChildPath "bin"
          
          $latestSdk = (Get-ChildItem -Path $binDir -Directory | Where-Object { $_.Name -like "10.0.*" } | Sort-Object Name -Descending | Select-Object -First 1).Name
          
          # Ép copy toàn bộ Midl.exe toolchain từ x64 (bỏ qua bước kiểm tra tồn tại)
          $srcX64 = Join-Path -Path $binDir -ChildPath "$latestSdk\x64"
          $dstX64 = Join-Path -Path $binDir -ChildPath "x64"
          if (-not (Test-Path $dstX64)) { New-Item -ItemType Directory -Force -Path $dstX64 | Out-Null }
          Copy-Item -Path "$srcX64\*" -Destination $dstX64 -Recurse -Force
          Write-Host "Copied Midl.exe x64 tools to $dstX64"

          # Ép copy toàn bộ Midl.exe toolchain cho x86 (để đề phòng configure.vbs tìm kiếm)
          $srcX86 = Join-Path -Path $binDir -ChildPath "$latestSdk\x86"
          $dstX86 = Join-Path -Path $binDir -ChildPath "x86"
          if (-not (Test-Path $dstX86)) { New-Item -ItemType Directory -Force -Path $dstX86 | Out-Null }
          Copy-Item -Path "$srcX86\*" -Destination $dstX86 -Recurse -Force
          Write-Host "Copied Midl.exe x86 tools to $dstX86"

          Write-Host "=== Configure VirtualBox ==="

          & cscript.exe //nologo configure.vbs "--with-SDK10=$sdk" "--with-libSDL=$env:VBOX_SDL_PATH"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== configure.log (last 200 lines) ==="
            if (Test-Path "configure.log") {
              Get-Content "configure.log" -Tail 200
            }
            throw "VirtualBox configure failed with exit code $LASTEXITCODE."
          }

          Write-Host "=== Generated configuration ==="
          foreach ($name in @("AutoConfig.kmk", "Config.kmk", "env.bat")) {
            if (Test-Path $name) {
              Write-Host "Found: $name"
            }
          }

      - name: Build VirtualBox without Guest Additions
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          $kmk = Join-Path$env:KBUILD_PATH "bin\win.amd64\kmk.exe"

          if (-not (Test-Path $kmk)) {
            throw "kmk.exe not found: $kmk"
          }

          $jobs = [Environment]::ProcessorCount
          Write-Host "Build jobs: $jobs"
          Write-Host "Building without Guest Additions..."

          & $kmk "-j$jobs" `
            "VBOX_WITHOUT_ADDITIONS=1" `
            "VBOX_WITH_ADDITIONS_PACKING="

          if ($LASTEXITCODE -ne 0) {
            throw "kmk build failed with exit code $LASTEXITCODE."
          }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-windows-build-diagnostics
          if-no-files-found: warn
          path: |
            configure.log
            AutoConfig.kmk
            Config.kmk
            env.bat
            *.log
            out/**/*.log
