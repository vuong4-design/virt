
name: Build VirtualBox 7.2 (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - VBox-7.2

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      VBOX_SOURCE: ${{ github.workspace }}
      KBUILD_PATH: ${{ github.workspace }}\kBuild\kBuild
      VBOX_WITHOUT_ADDITIONS: "1"
      VBOX_WITH_ADDITIONS_PACKING: ""

    steps:
      - name: Checkout VirtualBox
        uses: actions/checkout@v4
        with:
          repository: VirtualBox/virtualbox
          ref: VBox-7.2
          fetch-depth: 1
          submodules: recursive

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Verify kBuild and Windows SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Source directory ==="
          Write-Host $env:VBOX_SOURCE

          Write-Host "=== kBuild directory ==="
          Write-Host $env:KBUILD_PATH

          $required = @(
            "footer.kmk",
            "header.kmk",
            "rules.kmk",
            "bin\win.amd64\kmk.exe",
            "bin\win.amd64\kmk_ash.exe",
            "bin\win.x86\kmk.exe"
          )

          foreach ($item in $required) {
            $path = Join-Path $env:KBUILD_PATH $item
            if (-not (Test-Path $path)) {
              throw "Missing required kBuild file: $path"
            }
            Write-Host "OK: $path"
          }

          $sdk = "C:\Program Files (x86)\Windows Kits\10"
          if (-not (Test-Path (Join-Path $sdk "Include"))) {
            throw "Windows 10 SDK Include directory not found: $sdk"
          }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe not found. MSVC environment was not initialized."
          }

          Write-Host "=== Compiler ==="
          cl.exe 2>&1 | Select-Object -First 3

          Write-Host "=== SDK versions ==="
          Get-ChildItem (Join-Path $sdk "Include") -Directory |
            Where-Object { $_.Name -like "10.0.*" } |
            Select-Object -ExpandProperty Name

      - name: Patch legacy DDK 7.1 check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $file = Join-Path $env:VBOX_SOURCE "configure.vbs"

          if (-not (Test-Path $file)) {
            throw "configure.vbs not found: $file"
          }

          $lines = [System.IO.File]::ReadAllLines($file)
          $matches = @()

          for ($i = 2000; $i -lt $lines.Length; $i++) {
            if (
              $lines[$i].Contains("CheckForWinDDK") -and
              $lines[$i].Contains("strOptDDK") -and
              $lines[$i] -notmatch '^\s*(sub|function)\b'
            ) {
              $matches += $i
            }
          }

          if ($matches.Count -ne 1) {
            Write-Host "Matching lines:"
            Select-String -Path $file -Pattern "CheckForWinDDK" |
              ForEach-Object {
                Write-Host "$($_.LineNumber): $($_.Line)"
              }

            throw "Expected one DDK check call; found $($matches.Count)."
          }

          $idx = $matches[0]
          Write-Host "Original line $($idx + 1): $($lines[$idx])"

          $lines[$idx] =
            "    ' Experimental: skip legacy DDK 7.1 configure check"

          [System.IO.File]::WriteAllLines(
            $file,
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Patched line $($idx + 1)."
          Get-Content $file |
            Select-Object -Skip ($idx - 2) -First 5

      - name: Configure VirtualBox
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          $sdk = "C:\Program Files (x86)\Windows Kits\10"

          Write-Host "=== Configure VirtualBox ==="

          & cscript.exe //nologo configure.vbs "--with-SDK10=$sdk"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== configure.log (last 200 lines) ==="
            if (Test-Path "configure.log") {
              Get-Content "configure.log" -Tail 200
            }
            throw "VirtualBox configure failed with exit code $LASTEXITCODE."
          }

          Write-Host "=== Generated configuration ==="
          foreach ($name in @("AutoConfig.kmk", "Config.kmk", "env.bat")) {
            if (Test-Path $name) {
              Write-Host "Found: $name"
            }
          }

      - name: Build VirtualBox without Guest Additions
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"

          $kmk = Join-Path $env:KBUILD_PATH "bin\win.amd64\kmk.exe"

          if (-not (Test-Path $kmk)) {
            throw "kmk.exe not found: $kmk"
          }

          $jobs = [Environment]::ProcessorCount
          Write-Host "Build jobs: $jobs"
          Write-Host "Building without Guest Additions..."

          & $kmk "-j$jobs" `
            "VBOX_WITHOUT_ADDITIONS=1" `
            "VBOX_WITH_ADDITIONS_PACKING="

          if ($LASTEXITCODE -ne 0) {
            throw "kmk build failed with exit code $LASTEXITCODE."
          }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-windows-build-diagnostics
          if-no-files-found: warn
          path: |
            configure.log
            AutoConfig.kmk
            Config.kmk
            env.bat
            *.log
            out/**/*.log
