
name: Build VirtualBox Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - VBox-7.2

permissions:
  contents: read

concurrency:
  group: virtualbox-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build VirtualBox on Windows
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      VBOX_SOURCE: ${{ github.workspace }}
      BUILD_LOG_DIR: ${{ github.workspace }}\build-logs

    steps:
      - name: Checkout VirtualBox source
        uses: actions/checkout@v4
        with:
          ref: VBox-7.2
          fetch-depth: 1
          submodules: recursive

      - name: Show source revision
        shell: pwsh
        run: |
          Write-Host "Branch: VBox-7.2"
          git log -1 --oneline
          Write-Host "Source directory: $env:VBOX_SOURCE"

      - name: Verify source tree
        shell: pwsh
        run: |
          $requiredFiles = @(
            "configure.vbs",
            "Config.kmk",
            "Makefile.kmk",
            "Version.kmk"
          )

          foreach ($file in $requiredFiles) {
            $path = Join-Path $env:VBOX_SOURCE $file

            if (-not (Test-Path $path)) {
              Write-Error "Required source file missing: $file"
              exit 1
            }

            Write-Host "Found: $file"
          }

          New-Item -ItemType Directory `
            -Path $env:BUILD_LOG_DIR `
            -Force | Out-Null

      - name: Locate Visual Studio
        id: vs
        uses: microsoft/setup-msbuild@v2

      - name: Locate Visual Studio installation
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vsInstall = & $vswhere `
            -latest `
            -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsInstall) {
            throw "Visual Studio C++ toolchain not found"
          }

          "VS_INSTALL=$vsInstall" >> $env:GITHUB_ENV
          Write-Host "Visual Studio: $vsInstall"

      - name: Build VirtualBox and package installer
        shell: pwsh
        run: |
          $buildScript = Join-Path $env:BUILD_LOG_DIR "build.cmd"
          $stdoutLog = Join-Path $env:BUILD_LOG_DIR "build-stdout.log"
          $stderrLog = Join-Path $env:BUILD_LOG_DIR "build-stderr.log"

          @'
          @echo off
          setlocal

          echo === Initialize Visual Studio environment ===
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b %errorlevel%

          echo === Enter VirtualBox source directory ===
          cd /d "%VBOX_SOURCE%"
          if errorlevel 1 exit /b %errorlevel%

          echo === Configure VirtualBox ===
          cscript //nologo configure.vbs
          if errorlevel 1 exit /b %errorlevel%

          echo === Check generated build environment ===
          if not exist env.bat (
            echo ERROR: configure.vbs did not generate env.bat
            exit /b 2
          )

          echo === Load build environment ===
          call env.bat
          if errorlevel 1 exit /b %errorlevel%

          echo === Locate kmk ===
          where kmk
          if errorlevel 1 (
            echo ERROR: kmk was not found in PATH
            exit /b 3
          )

          echo === Build VirtualBox ===
          kmk
          if errorlevel 1 exit /b %errorlevel%

          echo === Package VirtualBox ===
          kmk packing
          if errorlevel 1 exit /b %errorlevel%

          echo === Build completed ===
          exit /b 0
          '@ | Set-Content -Path $buildScript -Encoding ASCII

          Write-Host "Build script: $buildScript"
          Write-Host "Build stdout: $stdoutLog"
          Write-Host "Build stderr: $stderrLog"

          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList @("/d", "/c", "`"$buildScript`"") `
            -WorkingDirectory $env:VBOX_SOURCE `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -Wait `
            -PassThru

          Write-Host "`n=== Build stdout (last 100 lines) ==="
          if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog -Tail 100
          }

          Write-Host "`n=== Build stderr (last 100 lines) ==="
          if (Test-Path $stderrLog) {
            Get-Content $stderrLog -Tail 100
          }

          if ($process.ExitCode -ne 0) {
            throw "VirtualBox build failed with exit code $($process.ExitCode). Check the build logs."
          }

      - name: Find generated installer files
        if: success()
        shell: pwsh
        run: |
          Write-Host "Searching for installer files..."

          $installers = Get-ChildItem `
            -Path $env:VBOX_SOURCE `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @(".exe", ".msi")
            }

          if (-not $installers) {
            Write-Warning "No .exe or .msi files were found."
            Write-Host "The packaging target may use a different output location or target."
          } else {
            $installers | Select-Object FullName, Length
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-windows-installers
          path: |
            **/*.exe
            **/*.msi
          if-no-files-found: warn
          retention-days: 14
