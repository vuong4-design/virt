# .github/workflows/build-virtualbox-windows.yml
name: Build VirtualBox Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - VBox-7.2
  pull_request:
    branches:
      - main
      - VBox-7.2

permissions:
  contents: read

concurrency:
  group: virtualbox-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VirtualBox 7.2 (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      VBOX_SOURCE: ${{ github.workspace }}
      BUILD_LOG_DIR: ${{ github.workspace }}\build-logs
      WINDOWS_KITS: C:\Program Files (x86)\Windows Kits\10
      WINDOWS_SDK_VERSION: 10.0.22621.0

    steps:
      # 1. Checkout VirtualBox 7.2
      - name: Checkout VirtualBox source
        uses: actions/checkout@v4
        with:
          repository: VirtualBox/virtualbox
          ref: VBox-7.2
          fetch-depth: 1
          submodules: recursive

      # 2. Create a directory for diagnostic logs
      - name: Prepare build logs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:BUILD_LOG_DIR |
            Out-Null

          Write-Host "Source: $env:VBOX_SOURCE"
          Write-Host "Logs:   $env:BUILD_LOG_DIR"

      # 3. Confirm kBuild is in the expected nested directory
      - name: Verify kBuild
        shell: pwsh
        run: |
          $kb = Join-Path $env:VBOX_SOURCE "kBuild\kBuild"

          $required = @(
            "$kb\footer.kmk",
            "$kb\header.kmk",
            "$kb\rules.kmk",
            "$kb\bin\win.amd64\kmk.exe",
            "$kb\bin\win.amd64\kmk_ash.exe"
          )

          $missing = @($required | Where-Object { !(Test-Path $_) })

          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING: $_" }
            throw "Required kBuild files are missing."
          }

          "KBUILD_PATH=$kb" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & "$kb\bin\win.amd64\kmk.exe" --version

      # 4. Verify the Windows SDK components
      - name: Verify Windows SDK 10.0.22621
        shell: pwsh
        run: |
          $sdk = $env:WINDOWS_KITS
          $ver = $env:WINDOWS_SDK_VERSION

          $required = @(
            "$sdk\Include\$ver\um",
            "$sdk\Include\$ver\shared",
            "$sdk\Include\$ver\ucrt",
            "$sdk\Lib\$ver\um\x64",
            "$sdk\bin\$ver\x64\rc.exe"
          )

          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              Write-Host "MISSING: $path"
              throw "Windows SDK component is missing."
            }
            Write-Host "OK: $path"
          }

          # Diagnostic only: these files do not prove that
          # every WDK component is installed.
          $ntddk = "$sdk\Include\$ver\km\ntddk.h"
          Write-Host "ntddk.h exists: $(Test-Path $ntddk)"

          Get-ChildItem "$sdk\Lib\$ver" -Directory |
            Select-Object -ExpandProperty FullName

      # 5. Experimental workaround for the legacy DDK 7.1 check.
      # This does NOT install a WDK and does NOT guarantee that
      # subsequent driver-related build targets will succeed.
      - name: Skip legacy DDK 7.1 configure check
        shell: pwsh
        run: |
          $file = Join-Path $env:VBOX_SOURCE "configure.vbs"
          $content = Get-Content $file -Raw

          $pattern = '(?m)^([ \t]*)CheckForWinDDK[ \t]+strOptDDK[ \t]*$'

          $matches = [regex]::Matches($content, $pattern)

          if ($matches.Count -ne 1) {
            throw "Expected exactly one CheckForWinDDK strOptDDK call; found $($matches.Count). Review configure.vbs before patching."
          }

          $content = [regex]::Replace(
            $content,
            $pattern,
            '$1'' Skipped experimentally for build without Guest Additions'
          )

          Set-Content -Path $file -Value $content -Encoding utf8

          Write-Host "Patched configure.vbs:"
          Select-String -Path $file -Pattern 'Skipped experimentally'

      # 6. Disable Guest Additions and their packaging in kBuild.
      # The actual effect depends on the build targets and source configuration.
      - name: Configure LocalConfig.kmk
        shell: pwsh
        run: |
          $config = Join-Path $env:VBOX_SOURCE "LocalConfig.kmk"

          @(
            "VBOX_WITHOUT_ADDITIONS = 1"
            "VBOX_WITH_ADDITIONS_PACKING ="
            "VBOX_WINDDK = WINSDK10-KM"
          ) | Set-Content -Path $config -Encoding utf8

          Get-Content $config

      # 7. Configure VirtualBox
      - name: Configure VirtualBox
        shell: pwsh
        run: |
          Set-Location $env:VBOX_SOURCE

          $configureLog = Join-Path $env:BUILD_LOG_DIR "configure.log"

          & cscript.exe //nologo configure.vbs `
            "--with-SDK10=$env:WINDOWS_KITS" 2>&1 |
            Tee-Object -FilePath $configureLog

          if ($LASTEXITCODE -ne 0) {
            throw "configure.vbs failed with exit code $LASTEXITCODE"
          }

      # 8. Build VirtualBox using kBuild
      - name: Build VirtualBox
        shell: pwsh
        run: |
          Set-Location $env:VBOX_SOURCE

          $kmk = Join-Path $env:KBUILD_PATH "bin\win.amd64\kmk.exe"
          $buildLog = Join-Path $env:BUILD_LOG_DIR "build.log"

          & $kmk `
            "VBOX_WITHOUT_ADDITIONS=1" `
            "VBOX_WITH_ADDITIONS_PACKING=" `
            "-j$env:NUMBER_OF_PROCESSORS" 2>&1 |
            Tee-Object -FilePath $buildLog

          if ($LASTEXITCODE -ne 0) {
            throw "kmk build failed with exit code $LASTEXITCODE"
          }

      # 9. Upload logs even when configure or build fails
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtualbox-windows-build-logs
          path: |
            build-logs/**
            Config.kmk
            AutoConfig.kmk
          if-no-files-found: ignore
          retention-days: 7
